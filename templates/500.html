{% extends 'base.html' %}
{% block title %}Server error — BenchmarkHub{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5">
  <div class="display-1 fw-bold" style="letter-spacing:-2px;">500</div>
  <h3 class="mb-2">Something went wrong</h3>
  <p class="text-muted mb-4" style="max-width:460px;">
    An unexpected error occurred while processing your request. The issue has been
    logged. Please try again, or return to the dashboard.
  </p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="bi bi-speedometer2 me-1"></i>Back to dashboard</a>
</div>
{% endblock %}
